package:
  name: baskerville-sudoku
  description: >
    Explainable Sudoku on the baskerville kernel: every eliminated pencil mark is
    a first-class fact carrying its derivation. Cliché as a solver, virgin
    as an explainer.
  dependencies:
    - arrays
    - console
    - effect
    - foldable-traversable
    - integers
    - baskerville-core
    - baskerville-conformance
    - maybe
    - node-process
    - ordered-collections
    - prelude
    - strings
    - tuples
  run:
    main: Sudoku.Main
  test:
    main: Test.Sudoku.Main
    dependencies:
      - assert
      - either
