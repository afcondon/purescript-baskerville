package:
  name: baskerville-core
  description: >
    A justification-propagating inference kernel: facts as proof terms, a
    hash-consed derivation DAG, and a monotone saturation engine. The
    explanation is the product. Bundles the conformance seam — measure a rule
    system against a client-supplied oracle: soundness, the gap, explainOr.
  publish:
    version: 0.1.3
    license: MIT
    location:
      githubOwner: afcondon
      githubRepo: purescript-baskerville
    owners:
      - keytype: ecdsa-sha2-nistp521
        public: AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1MjEAAACFBAArkYOfYhQVU6qJgppVJwlKMnP8HwKrJezMWX/N9gpQCrpVk+YBANNXuzT7/wp9D55UCMTtbXrqxi6M+lPWF929yAGfzA+2lu8HzCEPbCPWhlcM3mO0HsYEJA7WLnMwzRXHvYdhVG9ZEdxq/MgDM1rLSpflE6mHpMsbvRitZ9oTkIWQLw==
        id: afc@Andrews-MBP.lan
  dependencies:
    - arrays: ">=7.3.0 <8.0.0"
    - control: ">=6.0.0 <7.0.0"
    - either: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - prelude: ">=6.0.2 <7.0.0"
  test:
    main: Test.Baskerville.Main
    dependencies:
      - effect
      - console
      - assert
      - quickcheck
      - order-theory
workspace:
  packageSet:
    registry: 77.13.1
  extraPackages:
    # Path dep for the order-theory law suite (closure laws for saturate,
    # the NAF detector). Pin to a registry range once order-theory publishes.
    order-theory:
      path: ../purescript-order-theory
